# Loaded only by logged installer stages, through Arch's makepkg config loader.
# Preserve system drop-ins/user settings before selecting cached authentication.
source_makepkg_config "${ZANKEN_MAKEPKG_BASE_CONF:-/etc/makepkg.conf}"
# makepkg's default sudo -k forces a new prompt, incompatible with hidden logs.
PACMAN_AUTH=(sudo -n)
